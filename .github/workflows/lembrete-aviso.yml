name: Avisos da programação

on:
  schedule:
    # 6h a 20h59 de Recife (UTC-3) em 5 a 9 de fevereiro.
    - cron: "*/5 9-23 5-9 2 *"
    # 21h a 22h de Recife vira 0h a 1h UTC do dia seguinte (6 a 10 de fevereiro).
    - cron: "*/5 0-1 6-10 2 *"
  workflow_dispatch:
    inputs:
      forcar:
        description: Ignora a data da edição e o horário 6h a 22h
        type: boolean
        default: false

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/lembrete-aviso/package-lock.json
      - run: npm ci
        working-directory: jobs/lembrete-aviso
      - run: node executar.js
        working-directory: jobs/lembrete-aviso
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LEMBRETE_FORCAR: ${{ github.event_name == 'workflow_dispatch' && inputs.forcar == 'true' && '1' || '' }}
